<div class="p-6 bg-gray-50 dark:bg-gray-900 min-h-screen transition-colors duration-300">
  <div class="max-w-7xl mx-auto">
    <header class="mb-8">
      <h1 class="text-3xl font-bold text-gray-800 dark:text-white mb-2">Dashboard de Maestros</h1>
      <p class="text-gray-600 dark:text-gray-400">Bienvenido al sistema de gestión NPH</p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
      <div *ngFor="let card of dashboardCards"
        class="bg-primary-10 dark:bg-gray-800 rounded-xl shadow-md overflow-hidden hover:shadow-lg transition-shadow duration-300 transform hover:-translate-y-1">
        <div class="p-6">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-xl font-semibold text-gray-800 dark:text-white">{{ card.title }}</h2>
            <div [ngClass]="'bg-gradient-to-r ' + card.color" class="p-3 rounded-lg shadow-md">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                [ngClass]="'lucide lucide-' + card.icon" class="text-white">
                <ng-container [ngSwitch]="card.icon">
                  <ng-container *ngSwitchCase="'calendar-check'">
                    <rect width="18" height="18" x="3" y="4" rx="2" ry="2" />
                    <line x1="16" x2="16" y1="2" y2="6" />
                    <line x1="8" x2="8" y1="2" y2="6" />
                    <line x1="3" x2="21" y1="10" y2="10" />
                    <path d="m9 16 2 2 4-4" />
                  </ng-container>
                  <ng-container *ngSwitchCase="'file-text'">
                    <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" />
                    <polyline points="14 2 14 8 20 8" />
                    <line x1="16" x2="8" y1="13" y2="13" />
                    <line x1="16" x2="8" y1="17" y2="17" />
                    <line x1="10" x2="8" y1="9" y2="9" />
                  </ng-container>
                  <ng-container *ngSwitchCase="'users'">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                    <circle cx="9" cy="7" r="4" />
                    <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
                    <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                  </ng-container>
                  <ng-container *ngSwitchCase="'home'">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                    <polyline points="9 22 9 12 15 12 15 22" />
                  </ng-container>
                </ng-container>
              </svg>
            </div>
          </div>
          <div class="flex items-center justify-between">
            <div>
              <p class="text-3xl font-bold text-gray-900 dark:text-white">{{ card.count }}</p>
              <p class="text-sm text-gray-500 dark:text-gray-400">Total registros</p>
            </div>
            <button [routerLink]="[card.route]"
              class="px-4 py-2 bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-300 rounded-lg hover:bg-indigo-100 dark:hover:bg-indigo-800/30 transition-colors duration-200 text-sm font-medium">
              Ver detalles
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Sección de estadísticas -->
    <div class="mt-8 grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="bg-primary-10 dark:bg-gray-800 rounded-xl shadow-md p-6 lg:col-span-2">
        <h2 class="text-xl font-semibold text-gray-800 dark:text-white mb-4">Actividad reciente</h2>
        <div class="h-64 flex items-center justify-center bg-gray-100 dark:bg-gray-700 rounded-lg">
          <p class="text-gray-500 dark:text-gray-400">Gráfico de actividad</p>
        </div>
      </div>

      <div class="bg-primary-10 dark:bg-gray-800 rounded-xl shadow-md p-6">
        <h2 class="text-xl font-semibold text-gray-800 dark:text-white mb-4">Tareas pendientes</h2>
        <ul class="space-y-3">
          <li *ngFor="let i of [1, 2, 3, 4]" class="p-3 bg-gray-50 dark:bg-gray-700 rounded-lg">
            <div class="flex items-center">
              <div class="w-2 h-2 rounded-full bg-indigo-500 mr-3"></div>
              <span class="text-gray-700 dark:text-gray-300">Tarea pendiente {{ i }}</span>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
